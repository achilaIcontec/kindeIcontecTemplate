<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preview Plantilla Kinde ICONTEC</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="ico-shell">
      <header class="ico-header">
        <a class="ico-brand" href="#" aria-label="ICONTEC">
          <img
            class="ico-brand-logo"
            src="./assets/logoPNG.png"
            alt="Logo ICONTEC"
          />
        </a>
        <a id="switchLink" href="#" class="ico-switch-link">Crear cuenta</a>
      </header>

      <main class="ico-main" id="main">
        <section class="ico-widget-wrap" aria-label="Autenticacion ICONTEC">
          <aside class="ico-sidepanel">
            <img
              class="ico-sidepanel-logo"
              src="./assets/logoAnimated.gif"
              alt=""
              aria-hidden="true"
            />
          </aside>

          <section class="ico-form-card" aria-label="Formulario de acceso">
            <h1 id="formHeading">Iniciar sesion</h1>

            <form class="kinde-form" action="#" method="post" novalidate>
              <label for="email">Correo electronico</label>
              <input id="email" name="email" type="email" autocomplete="email" />

              <label for="password">Contrasena</label>
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
              />

              <button type="submit" class="submit-btn">Continuar</button>
            </form>

          
          </section>
        </section>
      </main>

      <footer class="ico-footer">
        <p>ICONTEC</p>
      </footer>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
